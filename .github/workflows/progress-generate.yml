name: Progress post (Cursor + PR)

# Manual: optional range_start / range_end (yyMMddHHmm UTC, inclusive). Empty → defaults: start = now − 1 day, end = now (UTC).
# Scheduled: same defaults (no args).
# Secrets: CURSOR_API_KEY; FOTONOZA_APP_GIT_URL (clone app).

on:
  schedule:
    - cron: "37 7 * * *"
  workflow_dispatch:
    inputs:
      range_start:
        description: "yyMMddHHmm UTC start (inclusive). Leave empty for now − 1 day."
        required: false
        type: string
      range_end:
        description: "yyMMddHHmm UTC end (inclusive). Leave empty for now (UTC)."
        required: false
        type: string

concurrency:
  group: progress-generate-${{ github.repository }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Clone private fotonoza-app
        env:
          FOTONOZA_APP_GIT_URL: ${{ secrets.FOTONOZA_APP_GIT_URL }}
        run: |
          set -euo pipefail
          if [ -z "${FOTONOZA_APP_GIT_URL}" ]; then
            echo "::error::Set repository secret FOTONOZA_APP_GIT_URL to an HTTPS clone URL with PAT (Contents read on fotonoza-app), e.g. https://x-access-token:<PAT>@github.com/<org>/fotonoza-app.git"
            exit 1
          fi
          git clone "${FOTONOZA_APP_GIT_URL}" "${GITHUB_WORKSPACE}/fotonoza-app"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies (fotonoza)
        run: npm ci

      - name: Configure git for commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Use GITHUB_TOKEN for push
        run: git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Require CURSOR_API_KEY
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          if [ -z "$CURSOR_API_KEY" ]; then
            echo "::error::Add repository secret CURSOR_API_KEY (Cursor dashboard → API keys)."
            exit 1
          fi

      - name: Run progress pipeline (git payload → Cursor → PR)
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            node scripts/RepoRep/RepoRepCi.mjs
          else
            RS="${{ github.event.inputs.range_start || '' }}"
            RE="${{ github.event.inputs.range_end || '' }}"
            node scripts/RepoRep/RepoRepCi.mjs "${RS}" "${RE}"
          fi

      - name: Upload git payload artifact
        if: always() && hashFiles('git-progress-payload.txt') != ''
        uses: actions/upload-artifact@v7
        with:
          name: progress-git-payload
          path: git-progress-payload.txt
